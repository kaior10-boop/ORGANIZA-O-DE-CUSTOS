<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Giro — Controle de Operações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-outer:#070A10; --bg:#0E1420; --surface:#161D2C; --surface2:#1C2436; --line:#262F42;
  --ink:#F2EFE9; --ink-dim:#8B93A7; --ink-faint:#5B6478;
  --brass:#C89B4A; --brass-dim:rgba(200,155,74,.14);
  --sage:#6FAE8B; --sage-dim:rgba(111,174,139,.14);
  --amber:#D9A441; --amber-dim:rgba(217,164,65,.14);
  --brick:#C2543E; --brick-dim:rgba(194,84,62,.14);
  --steel:#5C89C4; --steel-dim:rgba(92,137,196,.14);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;font-size:14.5px;display:flex;justify-content:center;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,select,textarea{font-family:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:15px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--brass);}
::placeholder{color:var(--ink-faint);}
ul{list-style:none;margin:0;padding:0;}
h1,h2,h3,h4{margin:0;font-weight:600;}
p{margin:0;}
.mono{font-family:var(--font-mono);}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
::-webkit-scrollbar{display:none;}

.app-frame{width:100%;max-width:452px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.5);display:flex;flex-direction:column;}
.app-body{flex:1;padding-bottom:96px;}

/* ---------- top header ---------- */
.topbar{padding:20px 20px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.topbar .greet{font-family:var(--font-display);font-size:21px;font-weight:600;}
.topbar .date{color:var(--ink-dim);font-size:12.5px;margin-top:3px;}
.topbar .backbtn{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-dim);font-weight:600;}
.topbar .backbtn svg{width:17px;height:17px;stroke:var(--ink-dim);}
.page-pad{padding:0 20px;}

/* ---------- hero ---------- */
.hero{margin:10px 20px 16px;padding:22px 20px;border-radius:var(--r-lg);background:linear-gradient(155deg,var(--surface),var(--surface2));border:1px solid var(--line);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(200,155,74,.16),transparent 70%);}
.hero .hlabel{font-size:12px;color:var(--ink-dim);font-weight:600;}
.hero .hvalue{font-family:var(--font-mono);font-size:32px;font-weight:700;margin-top:6px;color:var(--ink);letter-spacing:-.02em;}
.stat-strip{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;margin-bottom:18px;}
.stat-chip{flex:0 0 auto;min-width:118px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;}
.stat-chip .slabel{font-size:10.5px;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-chip .sval{font-family:var(--font-mono);font-size:15.5px;font-weight:700;margin-top:6px;}
.stat-chip.brass .sval{color:var(--brass);} .stat-chip.sage .sval{color:var(--sage);}
.stat-chip.brick .sval{color:var(--brick);} .stat-chip.steel .sval{color:var(--steel);}

/* ---------- section ---------- */
.section{margin:0 20px 20px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-head h3{font-size:15px;}
.section-head a,.section-head button{font-size:12.5px;color:var(--brass);font-weight:600;background:none;border:none;}

/* ---------- alerts ---------- */
.alert-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);margin-bottom:8px;}
.alert-row .adot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.alert-row.brick .adot{background:var(--brick);} .alert-row.amber .adot{background:var(--amber);} .alert-row.sage .adot{background:var(--sage);}
.alert-row span{font-size:13px;}

/* ---------- list rows (ledger style) ---------- */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.ledger-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.ledger-row:last-child{border-bottom:none;}
.ledger-row .lr-main{flex:1;min-width:0;}
.ledger-row .lr-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ledger-row .lr-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ledger-row .lr-right{text-align:right;flex-shrink:0;}
.ledger-row .lr-amt{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.ledger-row .lr-date{font-size:11px;color:var(--ink-dim);margin-top:2px;}

/* ---------- type badge / status badge ---------- */
.tbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.tbadge .tdot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.tbadge.brass{background:var(--brass-dim);color:var(--brass);} .tbadge.steel{background:var(--steel-dim);color:var(--steel);}
.tbadge.sage{background:var(--sage-dim);color:var(--sage);} .tbadge.amber{background:var(--amber-dim);color:var(--amber);}
.tbadge.brick{background:var(--brick-dim);color:var(--brick);} .tbadge.gray{background:rgba(139,150,165,.14);color:var(--ink-dim);}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#241A08;}
.btn.danger{background:transparent;border-color:var(--brick);color:var(--brick);}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-dim);}
.btn.block{width:100%;}
.btn.sm{padding:8px 13px;font-size:12.5px;}
.btn svg{width:15px;height:15px;}
.btn:disabled{opacity:.4;}

/* ---------- chips / filters ---------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-dim);}
.chip.active{background:var(--brass-dim);border-color:var(--brass);color:var(--brass);}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-dim);}
.field .req{color:var(--brick);}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;}
.seg button{flex:1;padding:9px 4px;border-radius:8px;background:none;border:none;color:var(--ink-dim);font-size:12.5px;font-weight:600;}
.seg button.active{background:var(--brass);color:#241A08;}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--ink-dim);}
.empty svg{width:38px;height:38px;margin:0 auto 14px;stroke:var(--ink-faint);}
.empty h4{color:var(--ink);font-size:14.5px;margin-bottom:6px;}
.empty p{font-size:12.5px;line-height:1.5;}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:452px;background:rgba(14,20,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:60;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-faint);padding:4px 0;}
.tabbtn svg{width:21px;height:21px;stroke:currentColor;}
.tabbtn span{font-size:10px;font-weight:600;}
.tabbtn.active{color:var(--brass);}
.fab{position:fixed;left:50%;transform:translateX(calc(-50% + 172px));bottom:calc(78px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--brass);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(200,155,74,.35);z-index:61;}
.fab svg{width:24px;height:24px;stroke:#241A08;stroke-width:2.3;}
@media(max-width:452px){ .fab{transform:translateX(calc(-50vw + 172px + 50%));} }

/* ---------- kpi mini cards (detail pages) ---------- */
.kpi-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.kpi-box .klabel{font-size:11px;color:var(--ink-dim);font-weight:600;}
.kpi-box .kval{font-family:var(--font-mono);font-weight:700;font-size:17px;margin-top:5px;}

/* ---------- avatar ---------- */
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brass-dim);color:var(--brass);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}

/* ---------- progress ---------- */
.progress{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
.progress>div{height:100%;background:var(--sage);}

/* ---------- donut / bars ---------- */
.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-item .bilabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-dim);margin-bottom:5px;}
.bar-track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-cell{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px;font-size:10px;position:relative;}
.cal-cell.empty{background:transparent;border:none;}
.cal-cell.today{border-color:var(--brass);}
.cal-cell .cd{font-weight:700;color:var(--ink-dim);}
.cal-cell.today .cd{color:var(--brass);}
.cal-cell .cdot{position:absolute;bottom:5px;left:5px;right:5px;height:3px;border-radius:2px;}
.cal-weekday{text-align:center;font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;font-weight:700;padding-bottom:6px;}

/* ---------- overlay / modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.overlay.center{align-items:center;padding:20px;}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:452px;max-height:92vh;overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));}
.overlay.center .modal{border-radius:18px;max-width:380px;}
.modal-grab{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:16px;font-family:var(--font-display);}
.modal-close{background:none;border:none;color:var(--ink-dim);font-size:22px;line-height:1;}
.toast-stack{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;padding:0 16px;}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sage);padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.4);animation:slidein .25s ease;}
.toast.error{border-left-color:var(--brick);}
@keyframes slidein{from{transform:translateY(-14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.confirm-msg{font-size:13.5px;color:var(--ink-dim);line-height:1.5;margin-bottom:20px;}
</style>
</head>
<body>
<div class="app-frame">
  <div id="app" class="app-body"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" id="fabBtn" onclick="openOperationModal()">PLUS_ICON</button>
</div>
<div class="overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="overlay center" id="confirmOverlay"><div class="modal" id="confirmBox"></div></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* =====================================================================
   UTILS
===================================================================== */
function pad(n,len){ let s=String(n); while(s.length<len) s='0'+s; return s; }
function money(v){ v=v||0; const neg=v<0; v=Math.abs(v); const fixed=v.toFixed(2); const parts=fixed.split('.');
  let intPart=parts[0]; const dec=parts[1]; let out=''; let count=0;
  for(let i=intPart.length-1;i>=0;i--){ out=intPart[i]+out; count++; if(count%3===0 && i!==0) out='.'+out; }
  return (neg?'-':'')+'R$ '+out+','+dec; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2); }
function isoToDate(iso){ if(!iso) return null; const p=iso.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function dateToISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2); }
function formatDateBR(iso){ if(!iso) return '—'; const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function addDaysISO(iso,days){ const d=isoToDate(iso); d.setDate(d.getDate()+days); return dateToISO(d); }
function addMonthsISO(iso,months){ const d=isoToDate(iso); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+months);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return dateToISO(d); }
function daysBetween(a,b){ const A=isoToDate(a),B=isoToDate(b); return Math.round((B-A)/86400000); }
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function initials(name){ const parts=(name||'').trim().split(' ').filter(Boolean); if(!parts.length) return '?'; return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase(); }
function toast(msg,type){ const el=document.createElement('div'); el.className='toast'+(type==='error'?' error':''); el.textContent=msg; document.getElementById('toastStack').appendChild(el); setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },3000); }
function confirmDialog(title,msg){
  return new Promise(resolve=>{
    const box=document.getElementById('confirmBox');
    box.innerHTML='<h3 style="font-size:15.5px;margin-bottom:10px;font-family:var(--font-display);">'+escapeHtml(title)+'</h3>'
      +'<p class="confirm-msg">'+escapeHtml(msg)+'</p>'
      +'<div style="display:flex;gap:10px;"><button class="btn block" id="confirmCancel">Cancelar</button><button class="btn danger block" id="confirmOk">Confirmar</button></div>';
    document.getElementById('confirmOverlay').classList.add('show');
    document.getElementById('confirmCancel').onclick=()=>{ document.getElementById('confirmOverlay').classList.remove('show'); resolve(false); };
    document.getElementById('confirmOk').onclick=()=>{ document.getElementById('confirmOverlay').classList.remove('show'); resolve(true); };
  });
}
function showModal(html){ document.getElementById('modalBox').innerHTML='<div class="modal-grab"></div>'+html; document.getElementById('modalOverlay').classList.add('show'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
function downloadFile(filename,content,mime){ const blob=new Blob([content],{type:mime||'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }
function csvEscape(v){ v=v===null||v===undefined?'':String(v); if(v.indexOf(',')>-1||v.indexOf('"')>-1){ return '"'+v.split('"').join('""')+'"'; } return v; }
function toCSV(rows){ return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'); }
function val(id){ const el=document.getElementById(id); return el? el.value.trim(): ''; }

/* =====================================================================
   DB LAYER (IndexedDB)
===================================================================== */
const DB_NAME='GiroDB', DB_VERSION=1; var _db=null;
function openDB(){ return new Promise((resolve,reject)=>{
  if(_db){ resolve(_db); return; }
  if(!window.indexedDB){ reject(new Error('IndexedDB indisponível neste navegador/contexto.')); return; }
  let req;
  try{ req=indexedDB.open(DB_NAME,DB_VERSION); }catch(err){ reject(err); return; }
  req.onupgradeneeded=(e)=>{ const db=e.target.result;
    if(!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts',{keyPath:'id'});
    if(!db.objectStoreNames.contains('operations')) db.createObjectStore('operations',{keyPath:'id'});
    if(!db.objectStoreNames.contains('installments')) db.createObjectStore('installments',{keyPath:'id'});
    if(!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts',{keyPath:'id'});
    if(!db.objectStoreNames.contains('cashTransactions')) db.createObjectStore('cashTransactions',{keyPath:'id'});
    if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'id'});
    if(!db.objectStoreNames.contains('counters')) db.createObjectStore('counters',{keyPath:'name'});
  };
  req.onsuccess=(e)=>{ _db=e.target.result; resolve(_db); };
  req.onerror=(e)=>reject(e.target.error);
});}
function txStore(name,mode){ return openDB().then(db=>db.transaction(name,mode||'readonly').objectStore(name)); }
function reqToPromise(req){ return new Promise((resolve,reject)=>{ req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
async function storeGetAll(name){ const s=await txStore(name); return reqToPromise(s.getAll()); }
async function storePut(name,obj){ const s=await txStore(name,'readwrite'); return reqToPromise(s.put(obj)); }
async function storeGet(name,id){ const s=await txStore(name); return reqToPromise(s.get(id)); }
async function storeDelete(name,id){ const s=await txStore(name,'readwrite'); return reqToPromise(s.delete(id)); }
async function storeClear(name){ const s=await txStore(name,'readwrite'); return reqToPromise(s.clear()); }
async function nextId(prefix){ const cur=await storeGet('counters',prefix); const v=(cur?cur.value:0)+1; await storePut('counters',{name:prefix,value:v}); return prefix+'-'+pad(v,5); }

/* Fallback: in-memory store used when IndexedDB can't be opened (e.g. Safari blocks
   storage for files opened directly from disk, without a real http/https origin).
   The app still works fully during the session; data just isn't saved automatically. */
var IS_MEMORY_MODE=false;
var MEM_DB={contacts:{},operations:{},installments:{},receipts:{},cashTransactions:{},settings:{},counters:{}};
function enableMemoryFallback(){
  IS_MEMORY_MODE=true;
  storeGetAll=function(name){ return Promise.resolve(Object.values(MEM_DB[name]||{})); };
  storePut=function(name,obj){ if(!MEM_DB[name]) MEM_DB[name]={}; const key=(obj.id!==undefined?obj.id:obj.name); MEM_DB[name][key]=obj; return Promise.resolve(obj); };
  storeGet=function(name,id){ return Promise.resolve(MEM_DB[name]?MEM_DB[name][id]:undefined); };
  storeDelete=function(name,id){ if(MEM_DB[name]) delete MEM_DB[name][id]; return Promise.resolve(); };
  storeClear=function(name){ MEM_DB[name]={}; return Promise.resolve(); };
}

async function addContact(data){ const id=await nextId('CT'); const now=new Date().toISOString(); const c=Object.assign({id,createdAt:now},data); await storePut('contacts',c); return c; }
async function updateContact(id,data){ const c=await storeGet('contacts',id); const u=Object.assign({},c,data); await storePut('contacts',u); return u; }
async function deleteContact(id){ await storeDelete('contacts',id); }
async function getContacts(){ return storeGetAll('contacts'); }

async function addOperation(data){ const id=await nextId('OP'); const now=new Date().toISOString();
  const op=Object.assign({id,totalReceived:0,status:'ATIVA',createdAt:now,updatedAt:now},data); op.outstandingBalance=op.receivableAmount; await storePut('operations',op); return op; }
async function updateOperation(id,data){ const o=await storeGet('operations',id); const u=Object.assign({},o,data,{updatedAt:new Date().toISOString()}); await storePut('operations',u); return u; }
async function deleteOperation(id){ await storeDelete('operations',id); const insts=await getInstallments(); for(const i of insts){ if(i.operationId===id) await storeDelete('installments',i.id); } }
async function getOperations(){ return storeGetAll('operations'); }

async function addInstallment(data){ const id=await nextId('PARC'); const inst=Object.assign({id,paidAmount:0,status:'ABERTA'},data); inst.remainingAmount=inst.amount; await storePut('installments',inst); return inst; }
async function updateInstallment(id,data){ const i=await storeGet('installments',id); const u=Object.assign({},i,data); await storePut('installments',u); return u; }
async function getInstallments(){ return storeGetAll('installments'); }

async function addReceipt(data){ const id=await nextId('REC'); const now=new Date().toISOString(); const r=Object.assign({id,status:'ATIVO',createdAt:now},data); await storePut('receipts',r); return r; }

  EMPRESTIMO:{label:'Empréstimo',color:'brass',investedLabel:'Valor liberado',receivableLabel:'Valor total a receber',itemLabel:null,outCat:'Capital liberado',inCat:'Recebimento (empréstimo)'},

  CONTA:{label:'Compra de conta',color:'amber',investedLabel:'Valor pago pela conta',receivableLabel:'Valor de face a receber',itemLabel:'Referente a',outCat:'Compra de conta',inCat:'Recebimento (conta)'}
};
const STATUS_META={
  ABERTA:{label:'Aberta',color:'steel'}, VENCE_HOJE:{label:'Vence hoje',color:'amber'}, PARCIAL:{label:'Parcial',color:'steel'},
  PAGA:{label:'Paga',color:'sage'}, ATRASADA:{label:'Atrasada',color:'brick'}, CANCELADA:{label:'Cancelada',color:'gray'},
  ATIVA:{label:'Em andamento',color:'steel'}, QUITADA:{label:'Concluída',color:'sage'}
};
function badge(status,cls){ const m=STATUS_META[status]||{label:status,color:'gray'}; return '<span class="tbadge '+m.color+'"><span class="tdot"></span>'+m.label+'</span>'; }
function typeBadge(type){ const m=TYPE_META[type]||{label:type,color:'gray'}; return '<span class="tbadge '+m.color+'"><span class="tdot"></span>'+m.label+'</span>'; }

function calcInstallmentStatus(inst){
  if(inst.status==='CANCELADA') return 'CANCELADA';
  if(inst.remainingAmount<=0.005) return 'PAGA';
  const today=todayISO();
  if(inst.dueDate<today) return 'ATRASADA';
  if(inst.dueDate===today) return 'VENCE_HOJE';
  if(inst.paidAmount>0.005) return 'PARCIAL';
  return 'ABERTA';
}
function calcOperationStatus(op,installments){
  if(op.status==='CANCELADA') return 'CANCELADA';
  const mine=installments.filter(i=>i.operationId===op.id && i.status!=='CANCELADA');
  if(mine.length && mine.every(i=>i.status==='PAGA')) return 'QUITADA';
  if(mine.some(i=>i.status==='ATRASADA')) return 'ATRASADA';
  return 'ATIVA';
}
function calcOutstandingBalance(op,installments){ return installments.filter(i=>i.operationId===op.id && i.status!=='CANCELADA').reduce((a,i)=>a+i.remainingAmount,0); }
function calcOverdueAmount(installments){ return installments.filter(i=>i.status==='ATRASADA').reduce((a,i)=>a+i.remainingAmount,0); }
function calcCashBalance(cashTx){ return cashTx.reduce((a,c)=>a+(c.type==='ENTRADA'?c.amount:-c.amount),0); }
function calcAllocatedCapital(op){ if(!op.receivableAmount) return 0; const ratio=op.outstandingBalance/op.receivableAmount; return Math.max(0,op.investedAmount*ratio); }
function calcExpectedProfit(ops){ return ops.filter(o=>o.status!=='CANCELADA').reduce((a,o)=>a+(o.receivableAmount-o.investedAmount),0); }
function calcReceivedTotal(receipts){ return receipts.filter(r=>r.status==='ATIVO').reduce((a,r)=>a+r.amount,0); }

var DATA={contacts:[],operations:[],installments:[],receipts:[],cashTransactions:[],settings:null};
async function reloadData(){
  const [contacts,operations,installments,receipts,cashTransactions,settings]=await Promise.all([getContacts(),getOperations(),getInstallments(),getReceipts(),getCashTx(),getSettings()]);
  installments.forEach(i=>i.status=calcInstallmentStatus(i));
  operations.forEach(o=>{ o.outstandingBalance=calcOutstandingBalance(o,installments); o.totalReceived=o.receivableAmount-o.outstandingBalance; o.status=o.status==='CANCELADA'?'CANCELADA':calcOperationStatus(o,installments); });
  DATA={contacts,operations,installments,receipts,cashTransactions,settings};
  return DATA;
}
function contactById(id){ return DATA.contacts.find(c=>c.id===id); }
function opById(id){ return DATA.operations.find(o=>o.id===id); }
function installmentsOfOp(id){ return DATA.installments.filter(i=>i.operationId===id).sort((a,b)=>a.number-b.number); }
function opsOfContact(id){ return DATA.operations.filter(o=>o.contactId===id); }

const TABS=[['#/','Início','home'],['#/operacoes','Operações','ops'],['#/vencimentos','Vencer','calendar'],['#/caixa','Caixa','wallet'],['#/mais','Mais','more']];
function parseRoute(){ let h=location.hash; if(h.indexOf('#/')===0) h=h.substring(2); else h=''; const parts=h.split('/').filter(Boolean); return parts; }
function go(hash){ location.hash=hash; window.scrollTo(0,0); }
window.addEventListener('hashchange',renderApp);

function renderTabbar(activeRoot){
  document.getElementById('tabbar').innerHTML=TABS.map(t=>{
    const root='#/'+(t[0]==='#/'?'':t[0].split('/')[1]);
    const isActive = t[0]==='#/'? activeRoot==='' : activeRoot===t[0].split('/')[1];
    return '<button class="tabbtn '+(isActive?'active':'')+'" onclick="go(\''+t[0]+'\')">'+ic(t[2])+'<span>'+t[1]+'</span></button>';
  }).join('');
  document.getElementById('fabBtn').style.display = (activeRoot==='vencimentos'||activeRoot==='mais')? 'none':'flex';
}

function computeAlerts(){
  const alerts=[];
  const overdue=DATA.installments.filter(i=>i.status==='ATRASADA');
  if(overdue.length) alerts.push({level:'brick',text:overdue.length+' parcela(s) em atraso.'});
  const dueToday=DATA.installments.filter(i=>i.status==='VENCE_HOJE');
  if(dueToday.length) alerts.push({level:'amber',text:dueToday.length+' vencimento(s) hoje.'});
  const receivedToday=DATA.receipts.filter(r=>r.status==='ATIVO'&&r.date===todayISO());
  if(receivedToday.length) alerts.push({level:'sage',text:receivedToday.length+' recebimento(s) hoje.'});
  return alerts;
}

async function renderApp(){
  const parts=parseRoute();
  const root=parts[0]||'';
  let html='';
  if(root==='') html=pageDashboard();
  else if(root==='operacoes' && parts[1]) html=pageOperationDetail(parts[1]);
  else if(root==='operacoes') html=pageOperacoes();
  else if(root==='vencimentos') html=pageVencimentos();
  else if(root==='caixa') html=pageCaixa();
  else if(root==='contatos' && parts[1]) html=pageContactDetail(parts[1]);
  else if(root==='contatos') html=pageContatos();
  else if(root==='relatorios') html=pageRelatorios();
  else if(root==='backup') html=pageBackup();
  else if(root==='mais') html=pageMais();
  else html='<div class="page-pad"><div class="empty"><h4>Página não encontrada</h4></div></div>';
  if(IS_MEMORY_MODE) html=memoryBannerHtml()+html;
  document.getElementById('app').innerHTML=html;
  renderTabbar(root);
  window.scrollTo(0,0);
}
function refreshPage(){ renderApp(); }

function pageDashboard(){
  if(!DATA.contacts.length && !DATA.operations.length && !DATA.cashTransactions.length) return pageWelcome();
  const caixa=calcCashBalance(DATA.cashTransactions);
  const openOps=DATA.operations.filter(o=>o.status==='ATIVA'||o.status==='ATRASADA');
  const alocado=openOps.reduce((a,o)=>a+calcAllocatedCapital(o),0);
  const aReceber=openOps.reduce((a,o)=>a+o.outstandingBalance,0);
  const monthStart=todayISO().substring(0,7);
  const recebidoMes=DATA.receipts.filter(r=>r.status==='ATIVO'&&r.date.substring(0,7)===monthStart).reduce((a,r)=>a+r.amount,0);
  const emAtraso=calcOverdueAmount(DATA.installments);
  const lucroPrevisto=calcExpectedProfit(DATA.operations);

  const alerts=computeAlerts();
  const alertHtml=alerts.length? alerts.map(a=>'<div class="alert-row '+a.level+'"><span class="adot"></span><span>'+a.text+'</span></div>').join('') : '';

  const upcoming=DATA.installments.filter(i=>i.status!=='PAGA'&&i.status!=='CANCELADA').sort((a,b)=>a.dueDate<b.dueDate?-1:1).slice(0,6);
  const upcomingHtml=upcoming.length? '<div class="ledger">'+upcoming.map(i=>{ const op=opById(i.operationId); const ct=op?contactById(op.contactId):null;
    return '<div class="ledger-row" onclick="go(\'#/operacoes/'+(op?op.id:'')+'\')" style="cursor:pointer;">'
    +'<div class="avatar">'+initials(ct?ct.name:'?')+'</div>'
    +'<div class="lr-main"><div class="lr-name">'+escapeHtml(ct?ct.name:'—')+'</div><div class="lr-sub">'+typeBadge(op?op.type:'')+'<span>venc. '+formatDateBR(i.dueDate)+'</span></div></div>'
    +'<div class="lr-right"><div class="lr-amt">'+money(i.remainingAmount)+'</div><div class="lr-date">'+badge(i.status)+'</div></div></div>'; }).join('')+'</div>'
    : '<div class="empty">'+ic('inbox')+'<h4>Tudo em dia</h4><p>Nenhum vencimento pendente no momento.</p></div>';

  // allocation by type
  const byType={}; openOps.forEach(o=>{ byType[o.type]=(byType[o.type]||0)+calcAllocatedCapital(o); });
  const maxAlloc=Math.max(1,Object.values(byType).reduce((a,b)=>Math.max(a,b),0));
  const barsHtml=Object.keys(TYPE_META).map(t=>{ const v=byType[t]||0; const m=TYPE_META[t]; const pct=Math.round((v/maxAlloc)*100);
    return '<div class="bar-item"><div class="bilabel"><span>'+m.label+'</span><span class="mono">'+money(v)+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--'+m.color+');"></div></div></div>'; }).join('');

  const hoje=new Date(); const diaSemana=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][hoje.getDay()];

  return '<div class="topbar"><div><div class="greet">Olá 👋</div><div class="date">'+diaSemana+', '+formatDateBR(todayISO())+'</div></div></div>'
  +'<div class="hero"><div class="hlabel">Caixa disponível</div><div class="hvalue">'+money(caixa)+'</div></div>'
  +'<div class="stat-strip">'
    +'<div class="stat-chip steel"><div class="slabel">Alocado</div><div class="sval">'+money(alocado)+'</div></div>'
    +'<div class="stat-chip steel"><div class="slabel">A receber</div><div class="sval">'+money(aReceber)+'</div></div>'
    +'<div class="stat-chip sage"><div class="slabel">Recebido no mês</div><div class="sval">'+money(recebidoMes)+'</div></div>'
    +'<div class="stat-chip brick"><div class="slabel">Em atraso</div><div class="sval">'+money(emAtraso)+'</div></div>'
    +'<div class="stat-chip brass"><div class="slabel">Lucro previsto</div><div class="sval">'+money(lucroPrevisto)+'</div></div>'
  +'</div>'
  +(alerts.length? '<div class="section"><div class="section-head"><h3>Alertas</h3></div>'+alertHtml+'</div>':'')
  +'<div class="section"><div class="section-head"><h3>Capital alocado por tipo</h3></div><div class="ledger" style="padding:16px;"><div class="bar-chart">'+barsHtml+'</div></div></div>'
  +'<div class="section"><div class="section-head"><h3>Próximos vencimentos</h3><a onclick="go(\'#/vencimentos\')">Ver todos</a></div>'+upcomingHtml+'</div>';
}

async function saveOperationForm(){
  const type=document.getElementById('of_type').value;
  const contactId=document.getElementById('of_contact').value;
  const itemDescription=val('of_item');
  const investedAmount=parseFloat(document.getElementById('of_invested').value)||0;
  const receivableAmount=parseFloat(document.getElementById('of_receivable').value)||0;
  const operationDate=val('of_date');
  const mode=document.getElementById('of_mode').value;
  const count=mode==='UNICA'? 1: (parseInt(document.getElementById('of_count').value)||1);
  const freq=mode==='UNICA'? 'MENSAL': document.getElementById('of_freq').value;
  const firstDue=val('of_firstdue');
  const notes=val('of_notes');
  if(!contactId){ toast('Selecione uma contraparte.','error'); return; }
  if(investedAmount<=0){ toast('Informe um valor investido maior que zero.','error'); return; }
  if(receivableAmount<=0){ toast('Informe um valor a receber maior que zero.','error'); return; }
  if(!operationDate||!firstDue){ toast('Informe as datas da operação.','error'); return; }
  try{
    const op=await addOperation({type,contactId,itemDescription,investedAmount,receivableAmount,operationDate,mode,installmentCount:count,frequency:freq,firstDueDate:firstDue,notes});
    const per=Math.round((receivableAmount/count)*100)/100; let running=0; let d=firstDue;
    for(let n=1;n<=count;n++){ let amt=n===count? Math.round((receivableAmount-running)*100)/100: per; running+=amt;
      await addInstallment({operationId:op.id,number:n,dueDate:d,amount:amt});
      d = freq==='SEMANAL'? addDaysISO(d,7): freq==='QUINZENAL'? addDaysISO(d,15): addMonthsISO(d,1);
    }
    await addCashTx({type:'SAIDA',category:TYPE_META[type].outCat,amount:investedAmount,date:operationDate,description:TYPE_META[type].outCat+' — '+op.id,relatedOperationId:op.id});
    closeModal(); await reloadData(); go('#/operacoes/'+op.id); toast('Operação registrada com sucesso.');
  }catch(e){ toast('Erro ao salvar: '+e.message,'error'); }
}
async function handleDeleteOperation(id){
  const recs=DATA.receipts.filter(r=>r.operationId===id&&r.status==='ATIVO');
  if(recs.length){ toast('Não é possível excluir: já existem recebimentos. Cancele a operação em vez disso.','error'); return; }
  const ok=await confirmDialog('Excluir operação','Esta ação não pode ser desfeita. Deseja continuar?');
  if(!ok) return;
  await deleteOperation(id); await reloadData(); go('#/operacoes'); toast('Operação excluída.');
}
async function handleCancelOperation(id){
  const ok=await confirmDialog('Cancelar operação','As parcelas em aberto serão marcadas como canceladas, mantendo o histórico.');
  if(!ok) return;
  const insts=installmentsOfOp(id);
  for(const i of insts){ if(i.status!=='PAGA') await updateInstallment(i.id,{status:'CANCELADA'}); }
  await updateOperation(id,{status:'CANCELADA'});
  await reloadData(); renderApp(); toast('Operação cancelada.');
}

async function saveReceiptForm(){
  const opId=document.getElementById('rf_op').value; const instId=document.getElementById('rf_inst').value;
  const date=val('rf_date'); const amount=parseFloat(document.getElementById('rf_amount').value)||0;
  const method=document.getElementById('rf_method').value; const notes=val('rf_notes');
  if(!opId||!instId){ toast('Selecione a operação e a parcela.','error'); return; }
  if(amount<=0){ toast('Informe um valor maior que zero.','error'); return; }
  const inst=DATA.installments.find(i=>i.id===instId); const op=opById(opId);
  try{

    await addCashTx({type:'ENTRADA',category:TYPE_META[op.type].inCat,amount,date,description:TYPE_META[op.type].inCat+' — '+opId,relatedOperationId:opId});

function pageVencimentos(){

  let inner='';
  if(CAL_VIEW==='calendario'){
    const y=CAL_MONTH.getFullYear(), m=CAL_MONTH.getMonth();
    const first=new Date(y,m,1); const offset=first.getDay(); const days=new Date(y,m+1,0).getDate();
    const label=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m]+' de '+y;
    const byDate={}; pending.forEach(i=>{ (byDate[i.dueDate]=byDate[i.dueDate]||[]).push(i); });
    let cells=''; for(let i=0;i<offset;i++) cells+='<div class="cal-cell empty"></div>';
    for(let d=1;d<=days;d++){ const iso=y+'-'+pad(m+1,2)+'-'+pad(d,2); const items=byDate[iso]||[]; const isToday=iso===todayISO();

    inner='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><button class="btn sm" onclick="calNav(-1)">‹</button><h3 style="font-size:14.5px;">'+label+'</h3><button class="btn sm" onclick="calNav(1)">›</button></div>'
    +'<div class="cal-grid" style="margin-bottom:6px;">'+['D','S','T','Q','Q','S','S'].map(w=>'<div class="cal-weekday">'+w+'</div>').join('')+'</div>'

  }

  +'<div class="page-pad" style="margin-bottom:12px;"><div class="chip-row"><button class="chip '+(CAL_VIEW==='lista'?'active':'')+'" onclick="CAL_VIEW=\'lista\';refreshPage()">Lista</button><button class="chip '+(CAL_VIEW==='calendario'?'active':'')+'" onclick="CAL_VIEW=\'calendario\';refreshPage()">Calendário</button></div></div>'

  +'<button class="btn primary block" onclick="saveContactForm('+(id?'\''+id+'\'':'null')+')">Salvar</button>');
}
async function saveContactForm(id){
  const name=val('cf_name'); if(!name){ toast('O nome é obrigatório.','error'); return; }
  const data={name,phone:val('cf_phone'),notes:val('cf_notes')};
  try{ if(id) await updateContact(id,data); else await addContact(data); closeModal(); await reloadData(); renderApp(); toast('Contato salvo.'); }
  catch(e){ toast('Erro: '+e.message,'error'); }
}
async function handleDeleteContact(id){
  if(opsOfContact(id).length){ toast('Não é possível excluir: contato possui operações.','error'); return; }
  const ok=await confirmDialog('Excluir contato','Deseja realmente excluir este contato?'); if(!ok) return;
  await deleteContact(id); await reloadData(); go('#/contatos'); toast('Contato excluído.');
}
function pageContactDetail(id){
  const c=contactById(id); if(!c) return '<div class="page-pad"><div class="empty"><h4>Contato não encontrado</h4></div></div>';
  const ops=opsOfContact(id);
  const totalInvestido=ops.reduce((a,o)=>a+(o.status!=='CANCELADA'?o.investedAmount:0),0);
  const totalRecebido=DATA.receipts.filter(r=>r.contactId===id&&r.status==='ATIVO').reduce((a,r)=>a+r.amount,0);
  const saldo=ops.reduce((a,o)=>a+(o.status!=='CANCELADA'?o.outstandingBalance:0),0);
  const rows=ops.map(o=>'<div class="ledger-row" onclick="go(\'#/operacoes/'+o.id+'\')" style="cursor:pointer;"><div class="lr-main"><div class="lr-name">'+(o.itemDescription||TYPE_META[o.type].label)+'</div><div class="lr-sub">'+typeBadge(o.type)+badge(o.status)+'</div></div><div class="lr-right"><div class="lr-amt">'+money(o.outstandingBalance)+'</div></div></div>').join('');
  return '<div class="topbar"><button class="backbtn" onclick="go(\'#/contatos\')">'+ic('back')+' Contatos</button></div>'
  +'<div class="page-pad">'
  +'<div style="display:flex;align-items:center;gap:12px;margin:6px 0 14px;"><div class="avatar" style="width:48px;height:48px;font-size:16px;">'+initials(c.name)+'</div><div><h1 style="font-family:var(--font-display);font-size:19px;">'+escapeHtml(c.name)+'</h1><div style="color:var(--ink-dim);font-size:12.5px;">'+escapeHtml(c.phone||'Sem telefone')+'</div></div></div>'
  +'<div class="kpi-mini"><div class="kpi-box"><div class="klabel">Investido</div><div class="kval">'+money(totalInvestido)+'</div></div><div class="kpi-box"><div class="klabel">Recebido</div><div class="kval" style="color:var(--sage);">'+money(totalRecebido)+'</div></div></div>'
  +'<div class="kpi-mini"><div class="kpi-box" style="grid-column:1/-1;"><div class="klabel">Saldo em aberto</div><div class="kval">'+money(saldo)+'</div></div></div>'
  +'<div style="display:flex;gap:10px;margin-bottom:16px;"><button class="btn" style="flex:1;" onclick="openContactModal(\''+id+'\')">'+ic('edit')+' Editar</button><button class="btn primary" style="flex:1;" onclick="openOperationModal(null,\''+id+'\')">'+ic('plus')+' Operação</button></div>'
  +'<div class="section-head"><h3>Operações ('+ops.length+')</h3></div>'
  +(ops.length? '<div class="ledger" style="margin-bottom:14px;">'+rows+'</div>':'<div class="empty">Nenhuma operação ainda.</div>')
  +'<button class="btn danger block" onclick="handleDeleteContact(\''+id+'\')">Excluir contato</button>'
  +'</div>';
}

/* =====================================================================
   MAIS (menu) / RELATÓRIOS / BACKUP
===================================================================== */
function pageMais(){
  const items=[
    ['#/contatos','Contatos','users','Cadastro de clientes e fornecedores'],
    ['#/relatorios','Relatórios','chart','Exportar dados em CSV'],
    ['#/backup','Backup','backup','Exportar, importar e limpar dados'],
  ];
  return '<div class="topbar"><div><div class="greet">Mais</div></div></div>'
  +'<div class="page-pad"><div class="ledger">'+items.map(i=>'<div class="ledger-row" onclick="go(\''+i[0]+'\')" style="cursor:pointer;"><div class="avatar">'+ic(i[2])+'</div><div class="lr-main"><div class="lr-name">'+i[1]+'</div><div class="lr-sub">'+i[3]+'</div></div><div class="lr-right">'+ic('chevron')+'</div></div>').join('')+'</div>'
  +'<div style="margin-top:24px;text-align:center;color:var(--ink-faint);font-size:11.5px;line-height:1.6;">Giro — Controle de Operações<br>Dados armazenados apenas neste dispositivo.</div>'
  +'</div>';
}
function pageRelatorios(){
  return '<div class="topbar"><button class="backbtn" onclick="go(\'#/mais\')">'+ic('back')+' Mais</button></div>'
  +'<div class="page-pad"><h1 style="font-family:var(--font-display);font-size:19px;margin-bottom:14px;">Relatórios</h1>'
  +reportRow('Operações','Todas as operações com valores e status.','exportOperationsCSV')
  +reportRow('Recebimentos','Histórico de recebimentos registrados.','exportReceiptsCSV')
  +reportRow('Caixa','Todas as movimentações de entrada e saída.','exportCashCSV')
  +reportRow('Contatos','Resumo por contato.','exportContactsCSV')
  +'</div>';
}
function reportRow(title,desc,fn){ return '<div class="ledger" style="margin-bottom:12px;"><div class="ledger-row"><div class="lr-main"><div class="lr-name">'+title+'</div><div class="lr-sub">'+desc+'</div></div><button class="btn sm" onclick="'+fn+'()">Exportar</button></div></div>'; }
function exportOperationsCSV(){ const rows=[['ID','Tipo','Contraparte','Investido','A receber','Recebido','Saldo','Status']];
  DATA.operations.forEach(o=>{ const c=contactById(o.contactId); rows.push([o.id,TYPE_META[o.type].label,c?c.name:'',o.investedAmount,o.receivableAmount,o.totalReceived,o.outstandingBalance,o.status]); });
  downloadFile('operacoes-'+todayISO()+'.csv',toCSV(rows),'text/csv'); }
function exportReceiptsCSV(){ const rows=[['Data','Contraparte','Operacao','Valor','Forma']];
  DATA.receipts.filter(r=>r.status==='ATIVO').forEach(r=>{ const c=contactById(r.contactId); rows.push([r.date,c?c.name:'',r.operationId,r.amount,r.method]); });
  downloadFile('recebimentos-'+todayISO()+'.csv',toCSV(rows),'text/csv'); }
function exportCashCSV(){ const rows=[['Data','Tipo','Categoria','Valor','Descricao']];
  DATA.cashTransactions.forEach(c=>rows.push([c.date,c.type,c.category,c.amount,c.description||''])); downloadFile('caixa-'+todayISO()+'.csv',toCSV(rows),'text/csv'); }
function exportContactsCSV(){ const rows=[['Nome','Telefone','Operacoes','SaldoAberto']];
  DATA.contacts.forEach(c=>{ const ops=opsOfContact(c.id); rows.push([c.name,c.phone||'',ops.length,ops.reduce((a,o)=>a+(o.status!=='CANCELADA'?o.outstandingBalance:0),0)]); });
  downloadFile('contatos-'+todayISO()+'.csv',toCSV(rows),'text/csv'); }

function pageBackup(){
  return '<div class="topbar"><button class="backbtn" onclick="go(\'#/mais\')">'+ic('back')+' Mais</button></div>'
  +'<div class="page-pad"><h1 style="font-family:var(--font-display);font-size:19px;margin-bottom:14px;">Backup</h1>'
  +'<div class="ledger" style="margin-bottom:14px;padding:16px;"><h3 style="font-size:14px;margin-bottom:6px;">Exportar backup</h3><p style="color:var(--ink-dim);font-size:12.5px;margin-bottom:12px;">Gera um arquivo .json com todos os seus dados.</p><button class="btn primary block" onclick="exportBackup()">Exportar backup</button></div>'
  +'<div class="ledger" style="margin-bottom:14px;padding:16px;"><h3 style="font-size:14px;margin-bottom:6px;">Importar backup</h3><p style="color:var(--ink-dim);font-size:12.5px;margin-bottom:10px;">Isso substituirá todos os dados atuais.</p><input type="file" accept="application/json" id="backupFile" style="margin-bottom:10px;"><button class="btn block" onclick="importBackup()">Importar backup</button></div>'
  +'<div class="ledger" style="padding:16px;"><h3 style="font-size:14px;margin-bottom:6px;">Dados de exemplo</h3><div style="display:flex;flex-direction:column;gap:8px;"><button class="btn block" onclick="loadDemoData().then(function(){reloadData().then(renderApp);toast(\'Dados de exemplo carregados.\')})">Carregar dados de exemplo</button><button class="btn danger block" onclick="handleClearAll()">Limpar todos os dados</button></div></div>'
  +'</div>';
}
function exportBackup(){ exportAllData().then(data=>{ downloadFile('giro-backup-'+todayISO()+'.json',JSON.stringify(data,null,2),'application/json'); toast('Backup exportado.'); }); }
async function importBackup(){
  const fi=document.getElementById('backupFile'); if(!fi.files.length){ toast('Selecione um arquivo.','error'); return; }
  const ok=await confirmDialog('Importar backup','Isso substituirá os dados atuais. Continuar?'); if(!ok) return;
  const reader=new FileReader();
  reader.onload=async function(e){ try{ const data=JSON.parse(e.target.result); await importAllData(data); await reloadData(); renderApp(); toast('Backup importado.'); } catch(err){ toast('Arquivo inválido.','error'); } };
  reader.readAsText(fi.files[0]);
}
async function handleClearAll(){ const ok=await confirmDialog('Limpar tudo','Isso apaga permanentemente todos os dados. Continuar?'); if(!ok) return; await clearAllData(); await reloadData(); go('#/'); toast('Todos os dados foram apagados.'); }

/* =====================================================================
   DEMO DATA
===================================================================== */
async function loadDemoData(){
  await addCashTx({type:'ENTRADA',category:'Capital inicial',amount:30000,date:addDaysISO(todayISO(),-90),description:'Capital inicial (demonstração)'});
  const names=['João Silva','Maria Souza','Carlos Pereira','Ana Costa','Pedro Lima','Juliana Alves','Marcos Santos','Fernanda Rocha'];
  const contactIds=[]; for(const n of names){ const c=await addContact({name:n,phone:'(84) 9'+Math.floor(1000+Math.random()*8999)+'-'+Math.floor(1000+Math.random()*8999)}); contactIds.push(c.id); }
  const types=Object.keys(TYPE_META);
  for(let n=0;n<14;n++){
    const contactId=contactIds[n%contactIds.length]; const type=types[n%types.length];
    const invested=300+(n*211)%2800; const margin=0.15+((n%5)*0.05); const receivable=Math.round(invested*(1+margin)*100)/100;
    const mode = n%3===0? 'UNICA':'PARCELADO'; const count = mode==='UNICA'?1: 2+(n%5); const freq=['SEMANAL','QUINZENAL','MENSAL'][n%3];
    const startDaysAgo=8+n*6; const operationDate=addDaysISO(todayISO(),-startDaysAgo);
    let firstDue = mode==='UNICA'? addDaysISO(operationDate,15) : (freq==='SEMANAL'? addDaysISO(operationDate,7): freq==='QUINZENAL'? addDaysISO(operationDate,15): addMonthsISO(operationDate,1));
    const itemDescription = type==='COMPRA_VENDA'? ['Notebook usado','iPhone 11','Bicicleta','TV 50"'][n%4] : (type!=='EMPRESTIMO'? 'Ref. #'+(1000+n) : '');
    const op=await addOperation({type,contactId,itemDescription,investedAmount:invested,receivableAmount:receivable,operationDate,mode,installmentCount:count,frequency:freq,firstDueDate:firstDue,notes:'Demonstração'});
    await addCashTx({type:'SAIDA',category:TYPE_META[type].outCat,amount:invested,date:operationDate,description:TYPE_META[type].outCat+' (demo) — '+op.id,relatedOperationId:op.id});
    const per=Math.round((receivable/count)*100)/100; let running=0; let d=firstDue; const instIds=[];
    for(let k=1;k<=count;k++){ let amt=k===count? Math.round((receivable-running)*100)/100: per; running+=amt;
      const inst=await addInstallment({operationId:op.id,number:k,dueDate:d,amount:amt}); instIds.push(inst.id);
      d = freq==='SEMANAL'? addDaysISO(d,7): freq==='QUINZENAL'? addDaysISO(d,15): addMonthsISO(d,1); }
    const insts=(await getInstallments()).filter(i=>i.operationId===op.id).sort((a,b)=>a.number-b.number);
    const mod=n%4;
    if(mod===0){ for(const inst of insts) await payDemo(inst,inst.amount,contactId,op.id,type); }
    else if(mod===1){ for(let idx=0;idx<Math.floor(insts.length/2);idx++) await payDemo(insts[idx],insts[idx].amount,contactId,op.id,type); }
    else if(mod===2 && insts[0]){ await payDemo(insts[0],Math.round(insts[0].amount*0.4*100)/100,contactId,op.id,type); }
  }
}
async function payDemo(inst,amount,contactId,operationId,type){
  await addReceipt({operationId,installmentId:inst.id,contactId,amount,date:inst.dueDate,method:['PIX','Transferência','Dinheiro'][Math.floor(Math.random()*3)],notes:'',status:'ATIVO'});
  const newPaid=(inst.paidAmount||0)+amount; const newRemaining=Math.max(0,inst.amount-newPaid);
  await updateInstallment(inst.id,{paidAmount:newPaid,remainingAmount:newRemaining});
  await addCashTx({type:'ENTRADA',category:TYPE_META[type].inCat,amount,date:inst.dueDate,description:TYPE_META[type].inCat+' (demo) — '+operationId,relatedOperationId:operationId});
}

/* =====================================================================
   INIT
===================================================================== */
(async function init(){
  try{
    try{ await reloadData(); }
    catch(dbErr){ console.warn('IndexedDB indisponível, usando modo temporário em memória.',dbErr); enableMemoryFallback(); await reloadData(); }
    if(!location.hash) location.hash='#/';
    await renderApp();
  }catch(e){ console.error(e); document.getElementById('app').innerHTML='<div class="page-pad"><div class="empty"><h4>Erro ao iniciar</h4><p>'+escapeHtml(e.message)+'</p></div></div>'; }
})();
</script>
